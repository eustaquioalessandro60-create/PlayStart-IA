<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F111A"/>
      <stop offset="100%" stop-color="#1E1E2F"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67E8F9"/>
      <stop offset="50%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect width="496" height="496" x="8" y="8" rx="104" fill="none" stroke="#06B6D4" stroke-width="4" stroke-opacity="0.3"/>
  
  <!-- Outer glowing ring / circuit nodes -->
  <circle cx="256" cy="256" r="170" fill="none" stroke="#06B6D4" stroke-width="6" stroke-dasharray="24 16" stroke-opacity="0.4"/>
  
  <!-- Play Triangle with AI Sparkle -->
  <g filter="url(#glow)">
    <polygon points="210,160 360,256 210,352" fill="url(#cyanGrad)"/>
    <!-- Core sparkle -->
    <path d="M 330 180 L 338 200 L 358 208 L 338 216 L 330 236 L 322 216 L 302 208 L 322 200 Z" fill="#FFFFFF"/>
    <circle cx="190" cy="180" r="10" fill="#67E8F9"/>
    <circle cx="190" cy="332" r="10" fill="#3B82F6"/>
    <circle cx="370" cy="256" r="12" fill="#67E8F9"/>
  </g>
  
  <!-- Text Brand Label -->
  <text x="256" y="420" text-anchor="middle" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="34" letter-spacing="4">PLAYSTART <tspan fill="#67E8F9">IA</tspan></text>
</svg>
